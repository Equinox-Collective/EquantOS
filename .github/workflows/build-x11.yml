name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Xfbdev and xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              libx11-dev libxext-dev libxmu-dev libxt-dev libxrender-dev \
              libxau-dev libxdmcp-dev xorgproto pkgconf wget tar sed

            # 1. Download compatible historic xtrans headers (version 1.2)
            wget https://www.x.org/releases/individual/lib/xtrans-1.2.tar.gz
            tar -xzf xtrans-1.2.tar.gz

            # 2. Build TinyX Server (Xfbdev)
            git clone https://github.com/idunham/tinyxserver.git
            cd tinyxserver

            # Copy matched xtrans-1.2 headers directly into tinyx include directories
            mkdir -p include/X11/Xtrans
            cp -r ../xtrans-1.2/*.h include/X11/
            cp -r ../xtrans-1.2/*.h include/X11/Xtrans/
            cp -r ../xtrans-1.2/*.c os/ 2>/dev/null || true

            # Disable PanoramiX in standard_definitions.mk and all sub-makefiles
            sed -i 's/-DPANORAMIX//g' standard_definitions.mk Makefile
            find . -name '*.mk' -exec sed -i 's/-DPANORAMIX//g' {} +
            find . -name 'Makefile*' -exec sed -i 's/-DPANORAMIX//g' {} +

            # Neutralize panoramiX header inclusion
            sed -i 's/#include <X11\/extensions\/panoramiXext.h>//g' Xext/panoramiX.h || true
            mkdir -p /usr/include/X11/extensions
            touch /usr/include/X11/extensions/panoramiXext.h

            make Xfbdev EXTRA_CFLAGS='-static -D_GNU_SOURCE' LDFLAGS='-static'
            strip hw/kdrive/fbdev/Xfbdev 2>/dev/null || strip Xfbdev 2>/dev/null || true
            cp hw/kdrive/fbdev/Xfbdev /dist/Xfbdev.elf 2>/dev/null || cp Xfbdev /dist/Xfbdev.elf
            cd ..

            # 3. Build xeyes from official release tarball
            wget https://www.x.org/releases/individual/app/xeyes-1.2.0.tar.gz
            tar -xzf xeyes-1.2.0.tar.gz
            cd xeyes-1.2.0
            ./configure LDFLAGS='-static' CFLAGS='-static -O2'
            make
            strip xeyes
            cp xeyes /dist/xeyes.elf
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf
name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Xfbdev and xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              libx11-dev libxext-dev libxmu-dev libxt-dev libxrender-dev \
              libxau-dev libxdmcp-dev libxrandr-dev libxfixes-dev \
              xorgproto pkgconf wget tar sed

            # 1. Build TinyX Server (Xfbdev)
            git clone https://github.com/idunham/tinyxserver.git
            cd tinyxserver

            # Disable PanoramiX (Multi-head extension) to prevent header conflicts
            sed -i 's/-DPANORAMIX//g' Makefile
            sed -i 's/-DPANORAMIX//g' */Makefile || true

            # Also provide dummy Display typedef if still referenced by system headers
            sed -i '1s/^/#include <X11\/Xlib.h>\n/' Xext/panoramiX.h || true

            make Xfbdev EXTRA_CFLAGS='-static -D_GNU_SOURCE' LDFLAGS='-static'
            strip hw/kdrive/fbdev/Xfbdev || strip Xfbdev
            cp hw/kdrive/fbdev/Xfbdev /dist/Xfbdev.elf 2>/dev/null || cp Xfbdev /dist/Xfbdev.elf
            cd ..

            # 2. Build xeyes from official tarball
            wget https://www.x.org/releases/individual/app/xeyes-1.2.0.tar.gz
            tar -xzf xeyes-1.2.0.tar.gz
            cd xeyes-1.2.0
            ./configure LDFLAGS='-static' CFLAGS='-static -O2'
            make
            strip xeyes
            cp xeyes /dist/xeyes.elf
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf
name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Truly Static Xfbdev and xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              freetype-dev freetype-static font-util font-util-dev \
              libpng-dev libpng-static bzip2-dev bzip2-static brotli-dev brotli-static \
              libbsd-dev libbsd-static libmd-dev libmd-static \
              libx11-dev libx11-static libxext-dev libxmu-dev libxt-dev libxrender-dev \
              libxau-dev libxdmcp-dev \
              libxtst-dev libxi-dev \
              libxcb-dev libxcb-static libsm-dev libice-dev \
              xorgproto xtrans autoconf automake libtool util-macros pkgconf bison flex wget tar xz \
              linux-headers

            export PKG_CONFIG_PATH='/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig'
            mkdir -p /build
            cd /build

            # 1. Сборка статических библиотек X11
            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libICE.git
            cd libICE && ./autogen.sh --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2' && make -j\$(nproc) install && cd /build

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libSM.git
            cd libSM && ./autogen.sh --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2' && make -j\$(nproc) install && cd /build

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libXt.git
            cd libXt && ./autogen.sh --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2' && make -j\$(nproc) install && cd /build

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libXi.git
            cd libXi && ./autogen.sh --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2' && make -j\$(nproc) install && cd /build

            # 2. Сборка статических libfontenc и libXfont2
            wget https://www.x.org/releases/individual/lib/libfontenc-1.1.8.tar.xz
            tar -xf libfontenc-1.1.8.tar.xz
            cd libfontenc-1.1.8
            ./configure --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2'
            make -j\$(nproc) install
            cd /build

            wget https://www.x.org/releases/individual/lib/libXfont2-2.0.7.tar.xz
            tar -xf libXfont2-2.0.7.tar.xz
            cd libXfont2-2.0.7
            ./configure --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2'
            make -j\$(nproc) install
            cd /build

            # 3. Build 100% Static Xfbdev
            git clone https://github.com/keshto/tinyx.git
            cd tinyx
            ./autogen.sh
            ./configure --prefix=/usr --libdir=/usr/lib --enable-xfbdev --disable-xvesa \
              --enable-static --disable-shared \
              CFLAGS='-O2 -no-pie -fno-pie'
            
            make -j\$(nproc) \
              Xfbdev_LDFLAGS='-all-static' \
              LDFLAGS='-all-static' \
              LIBS='-lfreetype -lpng -lbz2 -lbrotlidec -lbrotlicommon -lbsd -lmd -lz -lm'
            
            if [ -f hw/kdrive/fbdev/.libs/Xfbdev ]; then
              cp hw/kdrive/fbdev/.libs/Xfbdev /dist/Xfbdev.elf
            else
              XFBDEV_BIN=\$(find . -type f -name Xfbdev -perm -111 | head -n 1)
              cp \$XFBDEV_BIN /dist/Xfbdev.elf
            fi
            strip /dist/Xfbdev.elf
            cd /build

            # 4. Build 100% Static xeyes
            wget https://www.x.org/releases/individual/app/xeyes-1.2.0.tar.gz
            tar -xzf xeyes-1.2.0.tar.gz
            cd xeyes-1.2.0
            ./configure --prefix=/usr --without-present \
              --enable-static --disable-shared \
              CFLAGS='-O2 -no-pie -fno-pie' \
              LIBS='-lSM -lICE -lxcb -lXau -lXdmcp -lbsd -lmd'
            
            make -j\$(nproc) LDFLAGS='-all-static'
            
            if [ -f .libs/xeyes ]; then
              cp .libs/xeyes /dist/xeyes.elf
            else
              cp xeyes /dist/xeyes.elf
            fi
            strip /dist/xeyes.elf
            cd /build

            # 5. СТРОГИЙ КОНТРОЛЬ: проверка типа файла
            echo '========================================='
            echo 'ПРОВЕРКА Xfbdev:'
            readelf -h /dist/Xfbdev.elf | grep Type
            if readelf -l /dist/Xfbdev.elf | grep -q INTERP; then
              echo 'ОШИБКА: Xfbdev все еще имеет секцию INTERP!'
              exit 1
            fi

            echo 'ПРОВЕРКА xeyes:'
            readelf -h /dist/xeyes.elf | grep Type
            if readelf -l /dist/xeyes.elf | grep -q INTERP; then
              echo 'ОШИБКА: xeyes все еще имеет секцию INTERP!'
              exit 1
            fi

            echo 'УСПЕХ: ОБА БИНАРНИКА 100% ЧИСТАЯ СТАТИКА БЕЗ ИНТЕРПРЕТАТОРА!'
            echo '========================================='
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf
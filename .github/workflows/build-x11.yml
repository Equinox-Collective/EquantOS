name: Build X11 Dynamic (EXEC type)

on:
  workflow_dispatch:
    - '.github/workflows/build-x11.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.19
    
    steps:
    - name: Install dependencies
      run: |
        apk add --no-cache \
          build-base git meson ninja pkgconf \
          xorgproto pixman-dev libxfont2-dev libxkbfile-dev \
          libpciaccess-dev libx11-dev libxext-dev libxmu-dev \
          libxt-dev libxrender-dev mesa-dev font-util-dev \
          automake autoconf libtool xorg-macros util-macros

    - name: Build Xfbdev (X.Org Server)
      run: |
        git clone --depth 1 https://gitlab.freedesktop.org/xorg/xserver.git
        cd xserver
        # b_pie=false отключает PIE для получения Type: EXEC
        # LDFLAGS="-no-pie" для уверенности на этапе линковки
        export LDFLAGS="-no-pie"
        export CFLAGS="-fno-PIE"
        
        meson setup build \
          -Dkdrive=true \
          -Dxfbdev=true \
          -Dxephyr=false \
          -Dxwayland=false \
          -Dxorg=false \
          -Dglx=false \
          -Ddri3=false \
          -Dudev=false \
          -Dhal=false \
          -Dsystemd_logind=false \
          -Db_pie=false
          
        ninja -C build hw/kdrive/fbdev/Xfbdev
        cp build/hw/kdrive/fbdev/Xfbdev ../Xfbdev.elf

    - name: Build xeyes
      run: |
        git clone --depth 1 https://gitlab.freedesktop.org/xorg/app/xeyes.git
        cd xeyes
        ./autogen.sh
        # Форсируем EXEC тип через LDFLAGS
        ./configure LDFLAGS="-no-pie" CFLAGS="-fno-PIE"
        make -j$(nproc)
        cp xeyes ../xeyes.elf

    - name: Verify and List Dependencies
      run: |
        apk add --no-cache binutils
        echo "--- Xfbdev Analysis ---"
        readelf -h Xfbdev.elf | grep Type
        readelf -l Xfbdev.elf | grep INTERP
        ldd Xfbdev.elf
        
        echo "--- xeyes Analysis ---"
        readelf -h xeyes.elf | grep Type
        readelf -l xeyes.elf | grep INTERP
        ldd xeyes.elf

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: EquantOS-X11-dynamic
        path: |
          Xfbdev.elf
          xeyes.elf
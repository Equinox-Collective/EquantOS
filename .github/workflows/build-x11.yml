name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Truly Static Xfbdev and xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              libx11-dev libx11-static libxext-dev libxmu-dev libxt-dev libxrender-dev \
              libxau-dev libxdmcp-dev libxfont2-dev libxtst-dev libxi-dev \
              libxcb-dev libxcb-static libsm-dev libice-dev \
              xorgproto xtrans autoconf automake libtool util-macros pkgconf bison flex wget tar \
              linux-headers

            export CFLAGS='-O2 -no-pie -fno-pie'
            export LDFLAGS='-static -no-pie'

            # 1. Сборка статических библиотек (libICE, libSM, libXt, libXi)
            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libICE.git
            cd libICE && ./autogen.sh --enable-static --disable-shared && make -j\$(nproc) install && cd ..

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libSM.git
            cd libSM && ./autogen.sh --enable-static --disable-shared && make -j\$(nproc) install && cd ..

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libXt.git
            cd libXt && ./autogen.sh --enable-static --disable-shared && make -j\$(nproc) install && cd ..

            git clone --depth 1 https://gitlab.freedesktop.org/xorg/lib/libXi.git
            cd libXi && ./autogen.sh --enable-static --disable-shared && make -j\$(nproc) install && cd ..

            # 2. Build 100% Static Xfbdev
            git clone https://github.com/keshto/tinyx.git
            cd tinyx
            ./autogen.sh
            ./configure --prefix=/usr --enable-xfbdev --disable-xvesa \
              --enable-static --disable-shared
            make -j\$(nproc)
            
            XFBDEV_BIN=\$(find . -type f -name Xfbdev -perm -111 | head -n 1)
            strip \$XFBDEV_BIN
            cp \$XFBDEV_BIN /dist/Xfbdev.elf
            cd ..

            # 3. Build 100% Static xeyes
            wget https://www.x.org/releases/individual/app/xeyes-1.2.0.tar.gz
            tar -xzf xeyes-1.2.0.tar.gz
            cd xeyes-1.2.0
            PKG_CONFIG_PATH='/usr/local/lib/pkgconfig:'\$PKG_CONFIG_PATH ./configure --without-present \
              --enable-static --disable-shared \
              LDFLAGS='-static -no-pie -L/usr/local/lib -L/usr/lib' \
              LIBS='-lSM -lICE -lxcb -lXau -lXdmcp'
            make -j\$(nproc)
            strip xeyes
            cp xeyes /dist/xeyes.elf
            cd ..

            # 4. ВЕРИФИКАЦИЯ БИНАРНИКОВ
            echo '========================================='
            echo 'ПРОВЕРКА ТИПА БИНАРНИКОВ (ОБЯЗАН БЫТЬ EXEC):'
            readelf -h /dist/Xfbdev.elf | grep Type
            readelf -h /dist/xeyes.elf | grep Type

            echo 'ПРОВЕРКА НА ДИНАМИЧЕСКИЙ ИНТЕРПРЕТАТОР (ДОЛЖНО БЫТЬ ПУСТО):'
            readelf -l /dist/Xfbdev.elf | grep INTERP || echo 'Xfbdev: ЧИСТАЯ СТАТИКА (НЕТ ИНТЕРПРЕТАТОРА)!'
            readelf -l /dist/xeyes.elf | grep INTERP || echo 'xeyes: ЧИСТАЯ СТАТИКА (НЕТ ИНТЕРПРЕТАТОРА)!'
            echo '========================================='
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf
name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Truly Static Xfbdev and Pure Xlib xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              freetype-dev freetype-static font-util font-util-dev \
              libpng-dev libpng-static bzip2-dev bzip2-static brotli-dev brotli-static \
              libbsd-dev libbsd-static libmd-dev \
              libx11-dev libx11-static libxext-dev \
              libxau-dev libxdmcp-dev \
              libxcb-dev libxcb-static \
              xorgproto xtrans autoconf automake libtool util-macros pkgconf bison flex wget tar xz \
              linux-headers

            export PKG_CONFIG_PATH='/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig'
            mkdir -p /build
            cd /build

            # 1. Сборка статических библиотек шрифтов для Xfbdev
            wget https://www.x.org/releases/individual/lib/libfontenc-1.1.8.tar.xz
            tar -xf libfontenc-1.1.8.tar.xz && cd libfontenc-1.1.8
            ./configure --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2'
            make -j\$(nproc) install && cd /build

            wget https://www.x.org/releases/individual/lib/libXfont2-2.0.7.tar.xz
            tar -xf libXfont2-2.0.7.tar.xz && cd libXfont2-2.0.7
            ./configure --prefix=/usr --libdir=/usr/lib --enable-static --disable-shared CFLAGS='-static -no-pie -fno-pie -O2'
            make -j\$(nproc) install && cd /build

            # 2. Сборка 100% Static Xfbdev Server (с разрешением дублей ResetFontPrivateIndex)
            git clone https://github.com/keshto/tinyx.git
            cd tinyx
            ./autogen.sh
            ./configure --prefix=/usr --libdir=/usr/lib --enable-xfbdev --disable-xvesa \
              --enable-static --disable-shared \
              CFLAGS='-O2 -no-pie -fno-pie'
            
            make -j\$(nproc) \
              Xfbdev_LDFLAGS='-all-static -Wl,--allow-multiple-definition' \
              LDFLAGS='-all-static -Wl,--allow-multiple-definition' \
              LIBS='-lfreetype -lpng -lbz2 -lbrotlidec -lbrotlicommon -lbsd -lmd -lz -lm'
            
            if [ -f hw/kdrive/fbdev/.libs/Xfbdev ]; then
              cp hw/kdrive/fbdev/.libs/Xfbdev /dist/Xfbdev.elf
            else
              XFBDEV_BIN=\$(find . -type f -name Xfbdev -perm -111 | head -n 1)
              cp \$XFBDEV_BIN /dist/Xfbdev.elf
            fi
            strip /dist/Xfbdev.elf
            cd /build

            # 3. Чистый, легковесный xeyes на чистом Xlib (ТОЛЬКО libX11, без древнего мусора)
            cat << 'EOF' > pure_xeyes.c
            #include <X11/Xlib.h>
            #include <X11/Xutil.h>
            #include <stdio.h>
            #include <stdlib.h>
            #include <math.h>

            static void draw_eye(Display *dpy, Window win, GC gc_white, GC gc_black,
                                 int cx, int cy, int rx, int ry, int pr, int mx, int my) {
                XFillArc(dpy, win, gc_white, cx - rx, cy - ry, rx * 2, ry * 2, 0, 360 * 64);
                XDrawArc(dpy, win, gc_black, cx - rx, cy - ry, rx * 2, ry * 2, 0, 360 * 64);

                double dx = mx - cx;
                double dy = my - cy;
                double dist = sqrt(dx * dx + dy * dy);

                int max_dx = rx - pr - 3;
                int max_dy = ry - pr - 3;
                int px = cx, py = cy;

                if (dist > 0.0001) {
                    double angle = atan2(dy, dx);
                    double cos_a = cos(angle);
                    double sin_a = sin(angle);
                    double limit = (max_dx * max_dy) / sqrt((max_dy * cos_a) * (max_dy * cos_a) + (max_dx * sin_a) * (max_dx * sin_a));
                    if (dist > limit) dist = limit;
                    px = cx + (int)(dist * cos_a);
                    py = cy + (int)(dist * sin_a);
                }

                XFillArc(dpy, win, gc_black, px - pr, py - pr, pr * 2, pr * 2, 0, 360 * 64);
            }

            int main(void) {
                Display *dpy = XOpenDisplay(NULL);
                if (!dpy) {
                    fprintf(stderr, "pure_xeyes: cannot connect to X server at %s\n", XDisplayName(NULL));
                    return 1;
                }

                int screen = DefaultScreen(dpy);
                Window root = RootWindow(dpy, screen);
                int w = 220, h = 130;

                Window win = XCreateSimpleWindow(dpy, root, 150, 150, w, h, 2,
                                                 BlackPixel(dpy, screen), WhitePixel(dpy, screen));

                XStoreName(dpy, win, "EquantOS xeyes");
                XSelectInput(dpy, win, ExposureMask | PointerMotionMask | StructureNotifyMask);
                XMapWindow(dpy, win);

                GC gc_black = XCreateGC(dpy, win, 0, NULL);
                XSetForeground(dpy, gc_black, BlackPixel(dpy, screen));
                XSetLineAttributes(dpy, gc_black, 2, LineSolid, CapRound, JoinRound);

                GC gc_white = XCreateGC(dpy, win, 0, NULL);
                XSetForeground(dpy, gc_white, WhitePixel(dpy, screen));

                GC gc_bg = XCreateGC(dpy, win, 0, NULL);
                XSetForeground(dpy, gc_bg, 0xC0C0C0);

                int mx = w / 2, my = h / 2;
                XEvent ev;

                while (1) {
                    XNextEvent(dpy, &ev);
                    if (ev.type == MotionNotify) {
                        mx = ev.xmotion.x;
                        my = ev.xmotion.y;
                    } else if (ev.type == ConfigureNotify) {
                        w = ev.xconfigure.width;
                        h = ev.xconfigure.height;
                    }

                    XFillRectangle(dpy, win, gc_bg, 0, 0, w, h);
                    int ew = w / 2;
                    int rx = (ew - 20) / 2;
                    int ry = (h - 20) / 2;
                    int pr = (rx < ry ? rx : ry) / 3;
                    if (pr < 5) pr = 5;

                    draw_eye(dpy, win, gc_white, gc_black, ew / 2, h / 2, rx, ry, pr, mx, my);
                    draw_eye(dpy, win, gc_white, gc_black, ew + ew / 2, h / 2, rx, ry, pr, mx, my);
                    XFlush(dpy);
                }

                XCloseDisplay(dpy);
                return 0;
            }
            EOF

            # 4. Мгновенная компиляция статического xeyes на чистом libX11
            gcc -O2 -static -no-pie pure_xeyes.c -lX11 -lxcb -lXau -lXdmcp -lm -o /dist/xeyes.elf
            strip /dist/xeyes.elf

            # 5. СТРОГИЙ КОНТРОЛЬ: проверка типа файла
            echo '========================================='
            echo 'ПРОВЕРКА Xfbdev:'
            readelf -h /dist/Xfbdev.elf | grep Type
            if readelf -l /dist/Xfbdev.elf | grep -q INTERP; then
              echo 'ОШИБКА: Xfbdev все еще имеет секцию INTERP!'
              exit 1
            fi

            echo 'ПРОВЕРКА xeyes:'
            readelf -h /dist/xeyes.elf | grep Type
            if readelf -l /dist/xeyes.elf | grep -q INTERP; then
              echo 'ОШИБКА: xeyes все еще имеет секцию INTERP!'
              exit 1
            fi

            echo 'УСПЕХ: ОБА БИНАРНИКА 100% ЧИСТАЯ СТАТИКА БЕЗ ИНТЕРПРЕТАТОРА!'
            echo '========================================='
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf
name: Build Static X11 Stack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-x11.yml'

jobs:
  build-x11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Xfbdev and xeyes in Alpine Musl
        run: |
          docker run --rm -v $(pwd):/dist alpine:3.19 sh -c "
            set -e
            apk update
            apk add --no-cache build-base git zlib-dev zlib-static \
              libx11-dev libxext-dev libxmu-dev libxt-dev libxrender-dev \
              libxau-dev libxdmcp-dev libxfont2-dev xorgproto xtrans \
              autoconf automake libtool util-macros pkgconf bison flex wget tar

            # 1. Build Xfbdev using official TinyCore TinyX (fully compatible with modern xtrans)
            git clone https://github.com/tinycorelinux/tinyx.git
            cd tinyx
            ./autogen.sh
            ./configure --prefix=/usr --enable-xfbdev --disable-xvesa LDFLAGS='-static' CFLAGS='-static -O2'
            make -j\$(nproc)
            
            XFBDEV_BIN=\$(find . -type f -name Xfbdev -perm -111 | head -n 1)
            strip \$XFBDEV_BIN
            cp \$XFBDEV_BIN /dist/Xfbdev.elf
            cd ..

            # 2. Build xeyes from official release tarball
            wget https://www.x.org/releases/individual/app/xeyes-1.2.0.tar.gz
            tar -xzf xeyes-1.2.0.tar.gz
            cd xeyes-1.2.0
            ./configure LDFLAGS='-static' CFLAGS='-static -O2'
            make -j\$(nproc)
            strip xeyes
            cp xeyes /dist/xeyes.elf
          "

      - name: Upload X11 Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x11-binaries
          path: |
            Xfbdev.elf
            xeyes.elf